<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; position: relative; overflow: hidden; }
      .wrap { position: absolute; inset: 0; }
      .shot { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse 75% 60% at 50% 48%, rgba(0,0,0,0) 62%, rgba(20,10,5,0.07) 100%); }
      #blanc { position: absolute; inset: 0; background: #fff8ef; opacity: 0; }
      #suivre { position: absolute; left: 197px; top: 470px; width: 686px; opacity: 0; }
    </style>
  </head>
  <body>
    <!-- « Souvenirs » sur « VHS » (Mattyeux), extrait 18,4 s -> 49,0 s : un plan par ligne des paroles,
         les mots 3D sont rendus dans Blender (blender/souvenirs). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="30.6" data-width="1080" data-height="1920">
      <div id="w-p1" class="wrap" style="z-index: 1">
        <video id="p1" class="clip shot" src="assets/clips/p1.mp4" data-start="0" data-duration="2.5" data-track-index="1" muted playsinline></video>
      </div>
      <div id="w-p2" class="wrap" style="z-index: 2">
        <video id="p2" class="clip shot" src="assets/clips/p2.mp4" data-start="2.5" data-duration="1.2" data-track-index="1" muted playsinline></video>
      </div>
      <div id="w-p3" class="wrap" style="z-index: 3">
        <video id="p3" class="clip shot" src="assets/clips/p3.mp4" data-start="3.567" data-duration="1.233" data-track-index="1" muted playsinline></video>
      </div>
      <div id="w-z2" class="wrap" style="z-index: 4">
        <video id="z2" class="clip shot" src="assets/clips/z2.mp4" data-start="4.8" data-duration="1.2" data-track-index="1" muted playsinline></video>
      </div>
      <div id="w-z3" class="wrap" style="z-index: 5">
        <video id="z3" class="clip shot" src="assets/clips/z3.mp4" data-start="6.0" data-duration="1.1" data-track-index="1" muted playsinline></video>
      </div>
      <div id="w-z4" class="wrap" style="z-index: 6">
        <video id="z4" class="clip shot" src="assets/clips/z4.mp4" data-start="7.1" data-duration="1.4" data-track-index="1" muted playsinline></video>
      </div>
      <div id="w-z5" class="wrap" style="z-index: 7">
        <video id="z5" class="clip shot" src="assets/clips/z5.mp4" data-start="8.5" data-duration="1.1" data-track-index="1" muted playsinline></video>
      </div>
      <div id="w-z6" class="wrap" style="z-index: 8">
        <video id="z6" class="clip shot" src="assets/clips/z6.mp4" data-start="9.6" data-duration="2.3" data-track-index="1" muted playsinline></video>
      </div>
      <div id="w-z7" class="wrap" style="z-index: 9">
        <video id="z7" class="clip shot" src="assets/clips/z7.mp4" data-start="11.9" data-duration="2.3" data-track-index="1" muted playsinline></video>
      </div>
      <div id="w-z8" class="wrap" style="z-index: 10">
        <video id="z8" class="clip shot" src="assets/clips/z8.mp4" data-start="14.2" data-duration="2.3" data-track-index="1" muted playsinline></video>
      </div>
      <div id="w-rw" class="wrap" style="z-index: 11">
        <video id="rw" class="clip shot" src="assets/clips/rewind.mp4" data-start="16.5" data-duration="0.6" data-track-index="1" muted playsinline></video>
      </div>
      <div id="w-p8" class="wrap" style="z-index: 12">
        <video id="p8" class="clip shot" src="assets/clips/p8.mp4" data-start="17.1" data-duration="6.3" data-track-index="1" muted playsinline></video>
      </div>
      <div id="w-p9" class="wrap" style="z-index: 13">
        <video id="p9" class="clip shot" src="assets/clips/p9.mp4" data-start="23.4" data-duration="7.2" data-track-index="1" muted playsinline></video>
      </div>
      <div id="vignette" class="clip" data-start="0" data-duration="30.6" data-track-index="2" style="z-index: 30"></div>
      <div id="cassette" data-composition-id="cassette" data-composition-src="compositions/cassette.html"
        data-start="16.3" data-duration="0.9" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 40"></div>
      <div id="blanc" class="clip" data-start="29.0" data-duration="1.6" data-track-index="4" style="z-index: 45"></div>
      <img id="suivre" class="clip" src="assets/images/a-suivre.png" alt="à suivre…" data-start="29.6" data-duration="1.0" data-track-index="5" style="z-index: 46" />
      <audio id="musique" class="clip" src="assets/audio/vhs.mp3" data-start="0" data-duration="30.6" data-track-index="6" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // P2 -> P3 : la photo qui remplit l'ecran devient le vrai gouffre (meme cadrage)
      tl.fromTo("#w-p3", { opacity: 0 }, { opacity: 1, duration: 0.13, ease: "none" }, 3.567);
      // coups de zoom sur chaque coupe de zone (sur le temps), sur les conteneurs, jamais sur les videos
      [["#w-p3", 3.567, 1.05], ["#w-z2", 4.8, 1.07], ["#w-z3", 6.0, 1.07], ["#w-z4", 7.1, 1.08], ["#w-z5", 8.5, 1.07],
       ["#w-z6", 9.6, 1.07], ["#w-z7", 11.9, 1.07], ["#w-z8", 14.2, 1.07], ["#w-p8", 17.1, 1.1], ["#w-p9", 23.4, 1.05]
      ].forEach(([sel, at, from]) => tl.fromTo(sel, { scale: from }, { scale: 1, duration: 0.45, ease: "expo.out" }, at));
      // la bande saute 3-4 fois pendant le rembobinage
      [[16.53, -38], [16.63, 22], [16.77, -54], [16.91, 30]].forEach(([at, y]) =>
        tl.fromTo("#w-rw", { y }, { y: 0, duration: 0.06, ease: "steps(2)" }, at));
      // fin : fondu au blanc, puis « à suivre… »
      tl.fromTo("#blanc", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power1.in" }, 29.0);
      tl.fromTo("#suivre", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 29.6);
      tl.to({}, { duration: 30.6 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
