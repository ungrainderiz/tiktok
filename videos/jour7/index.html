<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #8fd3ff; }
      #root { width: 100%; height: 100%; position: relative; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="23.5" data-width="1080" data-height="1920">
      <!-- the game world, rendered in Blender from the real map and creatures (JEUX 2/blender/video_jour7) -->
      <video id="monde" class="clip" src="assets/video/monde.mp4" data-start="0" data-duration="23.5"
        data-track-index="1" muted playsinline
        style="position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; z-index: 1"></video>
      <div id="titres" data-composition-id="titres" data-composition-src="compositions/titres.html"
        data-start="0" data-duration="23.5" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="soustitres" data-composition-id="soustitres" data-composition-src="compositions/soustitres.html"
        data-start="0" data-duration="23.5" data-track-index="3" data-track-kind="captions"
        data-width="1080" data-height="1920" style="z-index: 3"></div>
      <audio id="voix" class="clip" src="assets/audio/voix.mp3" data-start="0" data-track-index="4" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
