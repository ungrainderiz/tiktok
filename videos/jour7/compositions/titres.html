  <script>
    const tl = gsap.timeline({ paused: true });
    const pop = (sel, at, from = 1.6) =>
      tl.fromTo(sel, { scale: from, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.28, ease: "back.out(1.6)" }, at);
    const out = (sel, at) => tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.14, ease: "power2.in" }, at);

    // JOUR 1 is already there at frame 0; only a hard little stamp on the subtitle

    tl.fromTo("#t-blocs .w", { y: 40 }, { y: 0, duration: 0.3, stagger: 0.08, ease: "expo.out" }, 2.9);
    out("#t-jour1", 4.36);
    out("#t-blocs", 4.36);

    // JOUR 7 slams in on "Aujourd'hui ?"

    out("#t-jour7", 5.58);

    // 8 zones: the number rolls 4 -> 8 like a slot machine
    pop("#t-zones", 5.68, 1.3);
    const nEl = document.getElementById("t-zones-n");
    const n = { v: 4 };
    tl.fromTo(n, { v: 4 }, { v: 8, duration: 0.5, ease: "power2.out", onUpdate: () => (nEl.textContent = String(Math.round(n.v))) }, 5.72);
    pop("#t-crea", 6.3);
    pop("#t-ui", 8.1);
    out("#t-zones", 9.3);
    out("#t-crea", 9.3);
    out("#t-ui", 9.3);

    // cracks draw across the sky
    ["#crack-a", "#crack-b", "#crack-c", "#crack-d"].forEach((id, i) => {
      const len = 600;
      tl.fromTo(id, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.35, ease: "power3.out" }, 9.65 + i * 0.12);
    });
    tl.to("#cracks", { opacity: 0, duration: 0.3 }, 11.1);
    tl.fromTo("#t-boss", { scale: 0.4, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.35, ease: "back.out(2)" }, 10.9);
    out("#t-boss", 12.1);

    pop("#t-principe", 12.39, 1.2);
    out("#t-principe", 13.36);

    // speed lines while falling (seeded)
    const sp = document.getElementById("speed");
    let seed = 7;
    const r = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    for (let i = 0; i < 22; i++) {
      const el = document.createElement("i");
      el.style.left = 40 + r() * 1000 + "px";
      el.style.height = 160 + r() * 260 + "px";
      sp.appendChild(el);
      tl.fromTo(el, { y: 2000 + r() * 600 }, { y: -700, duration: 0.5 + r() * 0.4, ease: "none" }, 13.56 + r() * 0.5);
    }

    tl.fromTo("#t-saute", { y: -260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "expo.out" }, 13.56);
    out("#t-saute", 14.47);
    tl.fromTo("#t-attrape", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.2)" }, 14.6);
    out("#t-attrape", 15.77);
    tl.fromTo("#t-ramene", { y: 260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.28, ease: "expo.out" }, 15.9);
    out("#t-ramene", 17.0);

    pop("#t-profond", 17.2, 1.2);
    tl.fromTo("#rare-stack", { y: 0 }, { y: -130 * 4, duration: 0.85, ease: "power2.inOut" }, 18.2);
    out("#t-profond", 19.2);
    out("#rare-roll", 19.2);

    window.__timelines["titres"] = tl;
