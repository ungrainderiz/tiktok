<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #8fd3ff;
    }
    #world-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
  <div id="root" data-composition-id="world" data-width="1080" data-height="1920">
    <canvas id="world-canvas" width="1080" height="1920"></canvas>
  </div>
  <script type="module">
    import * as THREE from "./assets/lib/three.module.min.js";

    // ---------- helpers ----------
    function mulberry32(a) {
      return function () {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rnd = mulberry32(80105);
    const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
    const lerp = (a, b, k) => a + (b - a) * k;
    const smooth = (k) => k * k * (3 - 2 * k);
    const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
    const easeOut = (k) => 1 - Math.pow(1 - k, 3);

    // ---------- renderer ----------
    const canvas = document.getElementById("world-canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(1080, 1920, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(58, 1080 / 1920, 0.5, 2000);
    scene.fog = new THREE.Fog(0x8fd3ff, 60, 420);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x445566, 1.4);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xfff1d6, 2.2);
    key.position.set(-40, 80, 60);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x9fd8ff, 1.0);
    rim.position.set(50, -20, -60);
    scene.add(rim);

    const H = 60; // height of one zone
    const ZONES = [
      { wall: 0x7fbf5a, alt: 0xb59d72, bg: 0x8fd3ff, light: 0xfff1d6 }, // 1 plateau & cascades
      { wall: 0xb7a6e6, alt: 0x8f86c8, bg: 0xcdc3f2, light: 0xf3ecff }, // 2 gorges brumeuses
      { wall: 0x3f8fb0, alt: 0x63e6f2, bg: 0x1d5876, light: 0xbff6ff }, // 3 grottes de cristal
      { wall: 0x4a3330, alt: 0xff6a2b, bg: 0x4a1a10, light: 0xffb27a }, // 4 braise
      { wall: 0x3a2f7a, alt: 0xff7bd5, bg: 0x17104a, light: 0xd9b8ff }, // 5 abime du vide
      { wall: 0x2fae7a, alt: 0xf4d35e, bg: 0x0f4434, light: 0xfff0c2 }, // 6 sanctuaire de jade
      { wall: 0xa9e8ff, alt: 0x7cf2b6, bg: 0x0d2f4d, light: 0xd8fbff }, // 7 faille boreale
      { wall: 0xff8fa3, alt: 0x1fb5b0, bg: 0x0b3a55, light: 0xffe0e6 }, // 8 recif englouti
    ];
    const BOTTOM = -H * ZONES.length;

    // ---------- canyon (voxels) ----------
    const cube = new THREE.BoxGeometry(3, 3, 3);
    const voxMat = new THREE.MeshLambertMaterial({ vertexColors: false });
    const cells = [];
    const S = 3;
    function wallX(y, z, side) {
      return side * (15 + 3 * Math.sin(y * 0.07 + side) + 2.2 * Math.sin(z * 0.21 + y * 0.03) + (rnd() < 0.15 ? 2.5 : 0));
    }
    for (let y = 0; y > BOTTOM; y -= S) {
      const zi = Math.min(ZONES.length - 1, Math.floor(-y / H));
      for (let z = -30; z <= 30; z += S) {
        for (const side of [-1, 1]) {
          const x = wallX(y, z, side);
          for (let d = 0; d < 2; d++) cells.push([x + side * d * S, y, z, zi]);
        }
      }
      for (let x = -15; x <= 15; x += S) cells.push([x, y, -30 - 2.2 * Math.sin(x * 0.4 + y * 0.05), zi]);
    }
    // plateau on top
    for (let x = -120; x <= 120; x += S) {
      for (let z = -120; z <= 60; z += S) {
        if (Math.abs(x) < 17 && z > -32) continue;
        cells.push([x, 1.5 * Math.round(Math.sin(x * 0.05) * Math.cos(z * 0.06) * 2) , z, -1]);
      }
    }
    const canyon = new THREE.InstancedMesh(cube, voxMat, cells.length);
    const m4 = new THREE.Matrix4();
    const col = new THREE.Color();
    cells.forEach(([x, y, z, zi], i) => {
      m4.makeTranslation(x, y, z);
      canyon.setMatrixAt(i, m4);
      if (zi < 0) col.setHex(rnd() < 0.2 ? 0x6aab45 : 0x84c95b);
      else {
        const zn = ZONES[zi];
        // blend into the next zone over the last 9 units: fused junctions
        const local = -y - zi * H;
        const next = ZONES[Math.min(ZONES.length - 1, zi + 1)];
        col.setHex(rnd() < 0.18 ? zn.alt : zn.wall);
        if (local > H - 9 && rnd() < (local - (H - 9)) / 9) col.setHex(next.wall);
        col.offsetHSL(0, 0, (rnd() - 0.5) * 0.08);
      }
      canyon.setColorAt(i, col);
    });
    scene.add(canyon);

    // decor per zone
    const decor = new THREE.Group();
    scene.add(decor);
    // zone 1: waterfalls (animated strips)
    const fallMat = new THREE.MeshBasicMaterial({ color: 0xe8fbff, transparent: true, opacity: 0.85 });
    const falls = [];
    for (let i = 0; i < 4; i++) {
      const g = new THREE.Mesh(new THREE.BoxGeometry(3, 26, 1.5), fallMat);
      g.userData = { x: i % 2 ? 12.5 : -12.5, z: -18 + i * 11, ph: rnd() * 26 };
      decor.add(g);
      falls.push(g);
    }
    // zone 3: crystals
    const crystalGeo = new THREE.ConeGeometry(1.6, 7, 5);
    const crystalMat = new THREE.MeshLambertMaterial({ color: 0x8ff4ff, emissive: 0x2bb7d0, emissiveIntensity: 0.6 });
    for (let i = 0; i < 40; i++) {
      const c = new THREE.Mesh(crystalGeo, crystalMat);
      const side = i % 2 ? 1 : -1;
      c.position.set(side * (11 + rnd() * 2), -2 * H - 6 - rnd() * 50, -26 + rnd() * 50);
      c.rotation.z = side * (0.9 + rnd() * 0.6);
      decor.add(c);
    }
    // zone 4: embers
    const emberGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
    const emberMat = new THREE.MeshBasicMaterial({ color: 0xffa040 });
    const embers = [];
    for (let i = 0; i < 70; i++) {
      const e = new THREE.Mesh(emberGeo, emberMat);
      e.userData = { x: -12 + rnd() * 24, z: -24 + rnd() * 44, y0: -4 * H + rnd() * H, sp: 3 + rnd() * 5 };
      decor.add(e);
      embers.push(e);
    }
    // zone 5: stars
    const starMat = new THREE.MeshBasicMaterial({ color: 0xffd6f4 });
    for (let i = 0; i < 90; i++) {
      const s = new THREE.Mesh(new THREE.OctahedronGeometry(0.35 + rnd() * 0.3), starMat);
      s.position.set(-12 + rnd() * 24, -4 * H - rnd() * H, -28 + rnd() * 50);
      decor.add(s);
    }
    // zone 6: lanterns
    const lanternMat = new THREE.MeshLambertMaterial({ color: 0xff5a3c, emissive: 0xffa23c, emissiveIntensity: 0.8 });
    for (let i = 0; i < 18; i++) {
      const l = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1.8, 8), lanternMat);
      l.position.set(-10 + rnd() * 20, -5 * H - 5 - rnd() * 50, -24 + rnd() * 40);
      decor.add(l);
    }
    // zone 7: aurora ribbons
    const auroraMat = new THREE.MeshBasicMaterial({ color: 0x7cf2b6, transparent: true, opacity: 0.45, side: THREE.DoubleSide });
    const auroras = [];
    for (let i = 0; i < 3; i++) {
      const a = new THREE.Mesh(new THREE.PlaneGeometry(26, 8, 24, 1), auroraMat);
      a.position.set(0, -6 * H - 12 - i * 16, -20 + i * 6);
      decor.add(a);
      auroras.push(a);
    }
    // zone 8: bubbles
    const bubbleMat = new THREE.MeshLambertMaterial({ color: 0xcffaff, transparent: true, opacity: 0.6 });
    const bubbles = [];
    for (let i = 0; i < 60; i++) {
      const b = new THREE.Mesh(new THREE.SphereGeometry(0.4 + rnd() * 0.6, 10, 8), bubbleMat);
      b.userData = { x: -12 + rnd() * 24, z: -24 + rnd() * 44, y0: BOTTOM + rnd() * H, sp: 2 + rnd() * 3 };
      decor.add(b);
      bubbles.push(b);
    }

    // ---------- "Jour 1": the old blocky world, far above ----------
    const OLD_Y = 400;
    const old = new THREE.Group();
    old.position.y = OLD_Y;
    scene.add(old);
    const greyMat = new THREE.MeshLambertMaterial({ color: 0xa3a7ad });
    const studMat = new THREE.MeshLambertMaterial({ color: 0xb5b9bf });
    const oldPieces = [];
    const zoneOldColors = [0xa3a7ad, 0x9aa0a8, 0x8f959c, 0x858b92];
    for (let i = 0; i < 4; i++) {
      const w = 22 - i * 3;
      const p = new THREE.Mesh(new THREE.BoxGeometry(w, 4, w), new THREE.MeshLambertMaterial({ color: zoneOldColors[i] }));
      p.position.set(0, -i * 6, 0);
      old.add(p);
      oldPieces.push(p);
      for (let sx = -w / 2 + 2; sx < w / 2; sx += 4) {
        for (let sz = -w / 2 + 2; sz < w / 2; sz += 4) {
          if (i < 3 && Math.abs(sx) < (w - 3) / 2 - 2 && Math.abs(sz) < (w - 3) / 2 - 2) continue;
          const s = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.8, 10), studMat);
          s.position.set(sx, -i * 6 + 2.4, sz);
          old.add(s);
          oldPieces.push(s);
        }
      }
    }
    // the old blocky bird
    const oldBird = new THREE.Group();
    const ob = (w, h, d, c, x, y, z) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: c }));
      m.position.set(x, y, z);
      oldBird.add(m);
      return m;
    };
    ob(4, 3, 5, 0xc9b28a, 0, 0, 0);
    ob(3, 3, 3, 0xc9b28a, 0, 2, 2);
    ob(1, 1, 1.6, 0xe0a030, 0, 1.8, 4.2);
    ob(0.5, 0.5, 0.2, 0x222222, 0.9, 2.6, 3.5);
    ob(0.5, 0.5, 0.2, 0x222222, -0.9, 2.6, 3.5);
    ob(5, 0.6, 3, 0xb59a72, 3.8, 0.4, 0);
    ob(5, 0.6, 3, 0xb59a72, -3.8, 0.4, 0);
    oldBird.position.set(0, 6, 0);
    old.add(oldBird);
    oldBird.children.forEach((c) => oldPieces.push(c));
    const oldVel = oldPieces.map(() => new THREE.Vector3(rnd() - 0.5, rnd() * 0.8, rnd() - 0.5).normalize().multiplyScalar(30 + rnd() * 40));
    const oldBase = oldPieces.map((p) => p.position.clone());
    const oldSpin = oldPieces.map(() => new THREE.Vector3(rnd() * 6, rnd() * 6, rnd() * 6));

    // ---------- the cute creature (new style) ----------
    function makeBird(bodyColor, wingColor) {
      const g = new THREE.Group();
      const mat = (c, e = 0) => new THREE.MeshLambertMaterial({ color: c, emissive: c, emissiveIntensity: e });
      const body = new THREE.Mesh(new THREE.SphereGeometry(2.4, 24, 18), mat(bodyColor, 0.08));
      body.scale.set(1, 0.95, 1.1);
      g.add(body);
      const belly = new THREE.Mesh(new THREE.SphereGeometry(1.9, 20, 16), mat(0xfff3e6, 0.05));
      belly.position.set(0, -0.5, 0.9);
      g.add(belly);
      const head = new THREE.Mesh(new THREE.SphereGeometry(1.7, 22, 16), mat(bodyColor, 0.08));
      head.position.set(0, 2.2, 1.2);
      g.add(head);
      for (const sx of [-1, 1]) {
        const eye = new THREE.Mesh(new THREE.SphereGeometry(0.42, 14, 10), mat(0x1b1b2a));
        eye.position.set(sx * 0.7, 2.5, 2.65);
        g.add(eye);
        const hl = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }));
        hl.position.set(sx * 0.7 + 0.12, 2.68, 3.02);
        g.add(hl);
        const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 8), mat(0xff8fb0, 0.2));
        cheek.position.set(sx * 1.15, 2.0, 2.4);
        g.add(cheek);
      }
      const beak = new THREE.Mesh(new THREE.ConeGeometry(0.42, 1.1, 10), mat(0xffb03a, 0.1));
      beak.rotation.x = Math.PI / 2;
      beak.position.set(0, 2.0, 3.1);
      g.add(beak);
      const wings = [];
      for (const sx of [-1, 1]) {
        const pivot = new THREE.Group();
        pivot.position.set(sx * 2.0, 0.6, 0);
        const w = new THREE.Mesh(new THREE.SphereGeometry(1.6, 16, 10), mat(wingColor, 0.08));
        w.scale.set(1.7, 0.32, 1.0);
        w.position.set(sx * 1.9, 0, 0);
        pivot.add(w);
        g.add(pivot);
        wings.push([pivot, sx]);
      }
      const tail = new THREE.Mesh(new THREE.ConeGeometry(0.9, 2, 8), mat(wingColor, 0.08));
      tail.rotation.x = -Math.PI / 2.4;
      tail.position.set(0, 0.2, -2.6);
      g.add(tail);
      g.userData.wings = wings;
      return g;
    }
    const bird = makeBird(0xb9a7ff, 0xffc2e0);
    scene.add(bird);

    // lasso + rope
    const ropeMat = new THREE.MeshLambertMaterial({ color: 0xe9cf96 });
    const lasso = new THREE.Mesh(new THREE.TorusGeometry(5, 0.35, 10, 40), ropeMat);
    lasso.rotation.x = Math.PI / 2;
    scene.add(lasso);
    const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 1, 8), ropeMat);
    scene.add(rope);
    // catch burst
    const burstMat = new THREE.MeshBasicMaterial({ color: 0xffd23f });
    const burst = [];
    for (let i = 0; i < 36; i++) {
      const b = new THREE.Mesh(new THREE.OctahedronGeometry(0.6), burstMat);
      const dir = new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).normalize();
      b.userData = { dir, sp: 10 + rnd() * 14 };
      scene.add(b);
      burst.push(b);
    }

    // ---------- the boss (Gardien de la Breche) ----------
    const portal = new THREE.Mesh(
      new THREE.TorusGeometry(16, 1.6, 12, 64),
      new THREE.MeshBasicMaterial({ color: 0xff5fb0 }),
    );
    portal.position.set(0, 110, -70);
    scene.add(portal);
    const portalCore = new THREE.Mesh(new THREE.CircleGeometry(15, 48), new THREE.MeshBasicMaterial({ color: 0x3a0a2e }));
    portalCore.position.copy(portal.position);
    portalCore.position.z -= 0.5;
    scene.add(portalCore);
    const SEG = 46;
    const serpent = [];
    const serpMat = new THREE.MeshLambertMaterial({ color: 0xff4fa3, emissive: 0x7a1450, emissiveIntensity: 0.5 });
    const serpMat2 = new THREE.MeshLambertMaterial({ color: 0xffd1ea, emissive: 0x7a1450, emissiveIntensity: 0.3 });
    for (let i = 0; i < SEG; i++) {
      const r = i === 0 ? 7 : 5.2 * (1 - i / SEG) + 1.2;
      const s = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), i % 3 === 0 ? serpMat2 : serpMat);
      scene.add(s);
      serpent.push(s);
    }
    const bossEyes = [];
    for (const sx of [-1, 1]) {
      const e = new THREE.Mesh(new THREE.SphereGeometry(1.4, 12, 10), new THREE.MeshBasicMaterial({ color: 0xfff4a8 }));
      scene.add(e);
      bossEyes.push([e, sx]);
    }
    const laser = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 1, 12), new THREE.MeshBasicMaterial({ color: 0xffe0f2 }));
    scene.add(laser);

    // ---------- camera path ----------
    // [time, pos, target]; a repeated time is a hard cut
    const K = [
      [0, [26, OLD_Y + 10, 40], [0, OLD_Y - 6, 0]],
      [4.5, [16, OLD_Y + 6, 30], [0, OLD_Y - 6, 0]],
      [4.95, [10, OLD_Y + 4, 36], [0, OLD_Y - 4, 0]],
      [4.95, [0, 46, 110], [0, -20, 0]],
      [5.68, [0, 18, 46], [0, -30, -6]],
      [9.5, [0, BOTTOM + 30, 10], [0, BOTTOM - 10, -10]],
      [9.5, [0, 6, 52], [0, 70, -60]],
      [12.25, [0, 4, 62], [0, 66, -60]],
      [12.25, [0, 26, 48], [0, -4, 0]],
      [13.5, [0, 22, 36], [0, -10, 0]],
      [14.6, [9, -88, 20], [0, -100, 0]],
      [15.9, [12, -94, 22], [0, -99, 0]],
      [17.15, [6, -40, 24], [0, -44, 0]],
      [17.15, [0, -70, 14], [0, -110, -10]],
      [19.35, [0, BOTTOM + 26, 12], [0, BOTTOM - 10, -10]],
      [19.35, [0, 150, 190], [0, -40, -20]],
      [23.5, [40, 130, 170], [0, -50, -20]],
    ];
    const vA = new THREE.Vector3(), vB = new THREE.Vector3(), tA = new THREE.Vector3(), tB = new THREE.Vector3();
    function cameraAt(t) {
      let i = 0;
      while (i < K.length - 2 && t >= K[i + 1][0]) i++;
      const [t0, p0, q0] = K[i];
      const [t1, p1, q1] = K[i + 1];
      let k = t1 > t0 ? clamp((t - t0) / (t1 - t0), 0, 1) : 1;
      // dives are linear-ish with ease at ends; others ease in-out
      k = smooth(k);
      vA.fromArray(p0); vB.fromArray(p1);
      tA.fromArray(q0); tB.fromArray(q1);
      camera.position.lerpVectors(vA, vB, k);
      const tgt = tA.lerp(tB, k);
      // shake during the boss and the explosion
      let sh = 0;
      if (t > 9.7 && t < 12.25) sh = 0.9 * Math.max(0, Math.sin((t - 9.7) * 3));
      if (t > 4.5 && t < 4.95) sh = 1.2;
      if (sh) {
        camera.position.x += sh * Math.sin(t * 91);
        camera.position.y += sh * Math.sin(t * 73 + 1);
      }
      camera.lookAt(tgt);
    }

    const bgA = new THREE.Color(), bgB = new THREE.Color();
    function zoneColorAtDepth(y) {
      const d = clamp(-y / H, 0, ZONES.length - 1);
      const i = Math.floor(d);
      const k = smooth(d - i);
      bgA.setHex(ZONES[i].bg);
      bgB.setHex(ZONES[Math.min(ZONES.length - 1, i + 1)].bg);
      return bgA.lerp(bgB, k);
    }

    const pink = new THREE.Color(0xff8fc8);
    function renderAt(t) {
      cameraAt(t);
      const camY = camera.position.y;

      // background and fog follow depth; boss turns the sky pink
      const bg = camY > 0 ? new THREE.Color(0x8fd3ff) : zoneColorAtDepth(camY).clone();
      if (camY > 200) bg.setHex(0x9fb8cc); // the flat grey sky of day 1
      if (t >= 9.5 && t < 12.25) bg.lerp(pink, smooth(seg(t, 10.9, 11.5)));
      scene.background = bg;
      scene.fog.color.copy(bg);
      scene.fog.near = camY < -10 ? 20 : 80;
      scene.fog.far = camY < -10 ? 150 : 520;
      hemi.intensity = camY > 200 ? 1.8 : 1.4;
      key.intensity = camY > 200 ? 0.9 : 2.2;

      // day 1 world: static, then blown apart at 4.5 s
      old.visible = t < 4.95;
      const ex = seg(t, 4.5, 4.95);
      oldPieces.forEach((p, i) => {
        p.position.copy(oldBase[i]).addScaledVector(oldVel[i], easeOut(ex));
        p.rotation.set(oldSpin[i].x * ex, oldSpin[i].y * ex, oldSpin[i].z * ex);
        const s = 1 - ex * 0.6;
        p.scale.set(s, s, s);
      });
      old.rotation.y = t * 0.12;

      // waterfalls, embers, bubbles, aurora
      falls.forEach((f) => {
        const u = f.userData;
        f.position.set(u.x, -((t * 22 + u.ph) % 52) + 4, u.z);
      });
      embers.forEach((e) => {
        const u = e.userData;
        e.position.set(u.x + Math.sin(t * 2 + u.z) * 1.5, u.y0 + ((t * u.sp) % H) - H / 2, u.z);
      });
      bubbles.forEach((b) => {
        const u = b.userData;
        b.position.set(u.x + Math.sin(t * 1.5 + u.z), u.y0 + ((t * u.sp) % H) - H / 2, u.z);
      });
      auroras.forEach((a, i) => {
        const pos = a.geometry.attributes.position;
        for (let v = 0; v < pos.count; v++) {
          const x = pos.getX(v);
          pos.setZ(v, Math.sin(x * 0.35 + t * 1.6 + i) * 2.2);
        }
        pos.needsUpdate = true;
      });

      // creature: shown for the gameplay beat, then for the call to action
      const showBird = t >= 12.25 && t < 17.15;
      bird.visible = showBird;
      lasso.visible = showBird && t >= 14.65 && t < 17.15;
      rope.visible = showBird && t >= 15.5;
      if (showBird) {
        let by = -100 + Math.sin(t * 2.4) * 0.8;
        let bx = Math.sin(t * 0.9) * 2;
        const pull = smooth(seg(t, 15.9, 16.9));
        by = lerp(by, -46, pull);
        bird.position.set(bx, by, 0);
        bird.rotation.set(0.1, -0.6 + Math.sin(t * 0.7) * 0.2, 0);
        const flap = t < 15.5 ? Math.sin(t * 15) * 0.7 : Math.sin(t * 30) * 0.25;
        bird.userData.wings.forEach(([p, sx]) => (p.rotation.z = sx * flap));
        // lasso: drops from above and tightens around the body
        const drop = easeOut(seg(t, 14.65, 15.1));
        const tight = smooth(seg(t, 15.1, 15.5));
        lasso.position.set(bx, lerp(by + 26, by + 0.2, drop), 0);
        const ls = lerp(1.25, 0.52, tight);
        lasso.scale.set(ls, ls, ls);
        // rope up to the winch
        const top = 20;
        const len = top - (by + 2.6);
        rope.position.set(bx, by + 2.6 + len / 2, 0);
        rope.scale.set(1, len, 1);
      }
      const bk = seg(t, 15.5, 16.1);
      burst.forEach((b) => {
        b.visible = showBird && bk > 0 && bk < 1;
        const u = b.userData;
        b.position.copy(bird.position).addScaledVector(u.dir, easeOut(bk) * u.sp);
        const s = 1 - bk;
        b.scale.set(s, s, s);
        b.rotation.set(t * 4, t * 5, 0);
      });

      // boss: portal opens, the serpent pours out, laser at the end
      const bossOn = t >= 9.5 && t < 12.25;
      portal.visible = portalCore.visible = bossOn;
      serpent.forEach((s) => (s.visible = bossOn));
      bossEyes.forEach(([e]) => (e.visible = bossOn));
      if (bossOn) {
        const open = easeOut(seg(t, 9.6, 10.3));
        portal.scale.setScalar(Math.max(0.01, open));
        portalCore.scale.setScalar(Math.max(0.01, open));
        portal.rotation.z = t * 0.6;
        const emerge = seg(t, 9.9, 12.25); // how far the head has travelled
        for (let i = 0; i < SEG; i++) {
          const u = emerge * 1.6 - i * 0.032; // path parameter, head first
          const s = serpent[i];
          if (u < 0) {
            s.position.set(0, 110, -80);
            s.scale.setScalar(0.001);
            continue;
          }
          s.scale.setScalar(1);
          s.position.set(
            Math.sin(u * 5.5 + t * 1.2) * 14 * Math.min(1, u * 2),
            110 - u * 30 + Math.sin(u * 7) * 4,
            -70 + u * 40,
          );
        }
        const head = serpent[0].position;
        const next = serpent[2].position;
        bossEyes.forEach(([e, sx]) => {
          e.position.set(head.x + sx * 3.2, head.y + 2.6, head.z + 5.4);
        });
        const fire = seg(t, 11.4, 12.25);
        laser.visible = fire > 0;
        if (fire > 0) {
          const from = new THREE.Vector3(head.x, head.y, head.z + 6);
          const to = new THREE.Vector3(0, -10, 10);
          const len = from.distanceTo(to);
          laser.position.lerpVectors(from, to, 0.5);
          laser.scale.set(1 + fire * 1.5, len, 1 + fire * 1.5);
          laser.lookAt(to);
          laser.rotateX(Math.PI / 2);
        }
      } else laser.visible = false;

      renderer.render(scene, camera);
    }

    window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
    renderAt(0);

    // keep the scene registered with the runtime
    const tl = gsap.timeline({ paused: true });
    tl.to({}, { duration: 23.5 }, 0);
    window.__timelines["world"] = tl;
  </script>
</template>
