<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      font-family: "Archivo Black", sans-serif;
    }
    #root .cap {
      position: absolute;
      left: 60px;
      right: 60px;
      top: 1150px;
      text-align: center;
      font-size: 58px;
      line-height: 1.15;
      color: #fff;
      paint-order: stroke fill;
      -webkit-text-stroke: 9px #1a1633;
      opacity: 0;
    }
  </style>
  <div id="root" data-composition-id="soustitres" data-width="1080" data-height="1920"></div>
  <script>
    // voiceover phrases, cut on the pauses measured in assets/audio/voix.mp3
    // (ffmpeg silencedetect at -35 dB / 0.12 s and -26 dB / 0.04 s; start = end of the pause before the phrase)
    const G = [
      [0.06, 1.04, "Il y a 7 jours,"],
      [1.04, 2.75, "mon jeu Roblox ressemblait à ça :"],
      [2.91, 4.5, "4 zones faites avec des blocs."],
      [4.87, 5.4, "Aujourd'hui ?"],
      [5.68, 6.42, "8 zones,"],
      [6.46, 8.24, "une soixantaine de créatures animées,"],
      [8.3, 9.4, "une nouvelle interface…"],
      [9.65, 10.97, "et un premier événement"],
      [10.97, 12.1, "avec un boss géant."],
      [12.39, 13.35, "Le principe est simple :"],
      [13.58, 14.62, "tu sautes dans un gouffre,"],
      [14.72, 16.17, "tu attrapes une créature au lasso,"],
      [16.26, 16.97, "et tu la ramènes."],
      [17.2, 18.08, "Plus tu descends,"],
      [18.2, 19.0, "plus elles sont rares."],
      [19.45, 20.04, "Abonne-toi,"],
      [20.07, 22.0, "je te montre chaque zone une par une."],
    ];
    const root = document.querySelector('[data-composition-id="soustitres"]');
    const tl = gsap.timeline({ paused: true });
    G.forEach(([s, e, text], i) => {
      const el = document.createElement("div");
      el.className = "cap";
      el.id = "cap-" + i;
      // inline: scoped composition CSS does not reach elements created at runtime
      el.style.cssText =
        "position:absolute;left:60px;right:60px;top:1150px;text-align:center;font-family:'Archivo Black',sans-serif;" +
        "font-size:58px;line-height:1.15;color:#fff;paint-order:stroke fill;-webkit-text-stroke:9px #1a1633;opacity:0";
      el.textContent = text;
      root.appendChild(el);
      tl.fromTo(el, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.1, ease: "power2.out" }, s);
      tl.to(el, { opacity: 0, duration: 0.08, ease: "power2.in" }, e - 0.08);
      tl.set(el, { opacity: 0, visibility: "hidden" }, e);
    });
    window.__timelines["soustitres"] = tl;
  </script>
</template>
