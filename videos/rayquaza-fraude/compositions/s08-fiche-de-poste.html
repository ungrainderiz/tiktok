<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8" /></head>
<body>
<template id="s08-template">
<style>

@font-face{font-family:"Archivo Black";src:url(assets/fonts/ArchivoBlack.woff2) format("woff2")}
@font-face{font-family:"Press Start 2P";src:url(assets/fonts/PressStart2P.woff2) format("woff2")}
@font-face{font-family:"Space Mono";font-weight:400;src:url(assets/fonts/SpaceMono-Regular.woff2) format("woff2")}
@font-face{font-family:"Space Mono";font-weight:700;src:url(assets/fonts/SpaceMono-Bold.woff2) format("woff2")}

.px{position:absolute;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.abs{position:absolute}
.disp{position:absolute;font-family:"Archivo Black";text-transform:uppercase;line-height:.92;letter-spacing:-.03em;color:#F3F1E4}
.pix{position:absolute;font-family:"Press Start 2P";line-height:1.35;color:#F3F1E4}
.mono{font-family:"Space Mono"}
.stamp{position:absolute;font-family:"Archivo Black";text-transform:uppercase;color:#E23B3B;border:16px solid #E23B3B;border-radius:22px;padding:4px 34px;letter-spacing:.02em;line-height:1.05}
.ghost{position:absolute;font-family:"Archivo Black";color:#fff;opacity:.07;white-space:nowrap;line-height:.8;text-transform:uppercase}
.gstack{display:grid}
.gstack>*{grid-area:1/1}
.gb{position:relative;z-index:2}
.gc{z-index:1;opacity:0;mix-blend-mode:screen}
.gc.w{color:#ff3b6b}.gc.c{color:#3bd5ff}
.cam{position:absolute;inset:0}

#s08{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 55%,#173f2c,#0B1F17 72%)}
</style>
<div id="s08" data-composition-id="s08" data-width="1080" data-height="1920">
<style>
#s08-autres{left:60px;top:450px;font-size:34px;color:#9fc7b2}
.s08-leg{position:absolute;top:540px;width:300px;image-rendering:pixelated;filter:grayscale(1) brightness(.55)}
#s08-zoom{position:absolute;inset:0}
#s08-card{left:70px;top:430px;width:880px;height:830px;background:#F7F3D9;color:#10140F;padding:50px 54px;box-shadow:18px 18px 0 #00000088}
#s08-card .k{font-family:"Space Mono";font-size:32px;margin-top:28px}
#s08-card .t{font-family:"Space Mono";font-weight:700;font-size:38px;letter-spacing:.1em}
#s08-card .rule{height:8px;background:#10140F;margin-top:20px}
#s08-poste{font-family:"Archivo Black";font-size:80px;line-height:1.12;letter-spacing:-.03em;text-transform:uppercase;margin-top:12px}
#s08-hl{background:linear-gradient(#F4C430,#F4C430) no-repeat 0 70%/0% 75%;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 8px}
#s08-row{display:flex;align-items:center;gap:26px;margin-top:6px}
#s08-row img{width:190px;image-rendering:pixelated}
#s08-row span{font-family:"Archivo Black";font-size:78px;text-transform:uppercase;letter-spacing:-.02em}
</style>
<div class="pix" id="s08-autres">LES AUTRES :</div>
<img class="s08-leg" src="assets/sprites/arceus.png" style="left:40px" alt="">
<img class="s08-leg" src="assets/sprites/dialga.png" style="left:390px" alt="">
<img class="s08-leg" src="assets/sprites/palkia.png" style="left:740px" alt="">
<div id="s08-zoom">
  <div class="abs" id="s08-card">
    <div class="t">FICHE DE POSTE</div>
    <div class="rule"></div>
    <div class="k">POSTE :</div>
    <div id="s08-poste"><span id="s08-hl">Gardien de la planète</span></div>
    <div class="k">TITULAIRE :</div>
    <div id="s08-row"><img src="assets/sprites/rayquaza.png" alt="Rayquaza"><span>Rayquaza</span></div>
    <div class="k">MISSION : surveiller le ciel</div>
  </div>
</div>
</div>
<script>
(() => {
const tl = gsap.timeline({ paused: true });
const S0 = 34.5;
const W = (t) => +(t + 0.2 - S0).toFixed(3);
const G = (g) => +(g - S0).toFixed(3);

const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const shake = (target, start, dur, amp, seed = 1) => {
  const n = Math.max(2, Math.round(dur / 0.04));
  for (let i = 0; i < n; i++) {
    const k = 1 - i / n;
    tl.to(target, { x: (hash(seed * 31 + i * 7) * 2 - 1) * amp * k, y: (hash(seed * 17 + i * 13) * 2 - 1) * amp * k, duration: dur / n, ease: "none" }, start + (i * dur) / n);
  }
  tl.to(target, { x: 0, y: 0, duration: 0.04, ease: "none" }, start + dur);
};
const glitch = (stackSel, start, dur, maxSplit) => {
  const copies = gsap.utils.toArray(stackSel + " .gc");
  const amp = { a: 0 };
  tl.set(amp, { a: 1 }, start);
  tl.set(copies, { opacity: 0.85 }, start);
  tl.to(amp, { a: 0, duration: dur, ease: "power3.in", onUpdate: () => {
    const step = Math.floor(tl.time() / 0.05);
    copies.forEach((el, l) => gsap.set(el, { x: (hash(step * 13 + l * 7) * 2 - 1) * maxSplit * amp.a, y: (hash(step * 29 + l * 11) * 2 - 1) * maxSplit * 0.35 * amp.a }));
  } }, start);
  tl.set(copies, { x: 0, y: 0, opacity: 0 }, start + dur);
};
const pop = (el, t, d = 0.45, from = 0) => tl.fromTo(el, { scale: from, opacity: 0 }, { scale: 1, opacity: 1, duration: d, ease: "back.out(2.2)" }, t);
const slam = (el, t, from = 2.6, rot = 0) => tl.fromTo(el, { scale: from, opacity: 0, rotation: rot }, { scale: 1, opacity: 1, rotation: rot, duration: 0.24, ease: "power4.in" }, t);
const breathe = (el, t, dur, amp = 14, period = 1.6) => tl.fromTo(el, { y: 0 }, { y: -amp, duration: period / 2, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor(dur / (period / 2)) - 1) }, t);

tl.fromTo("#s08-autres", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0);
tl.fromTo(".s08-leg", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out", stagger: 0.08 }, W(34.72));
// « LE gardien » : les autres dégagent, la fiche entre
tl.to(".s08-leg", { x: -1300, duration: 0.4, ease: "power3.in", stagger: 0.05 }, W(36.7));
tl.to("#s08-autres", { opacity: 0, duration: 0.2 }, W(36.7));
tl.fromTo("#s08-card", { x: 1200, rotation: 6 }, { x: 0, rotation: -2, duration: 0.5, ease: "expo.out" }, W(36.95));
tl.to("#s08-hl", { backgroundSize: "100% 75%", duration: 0.9, ease: "power1.inOut" }, W(37.2));
tl.fromTo("#s08-row", { scale: 0.4, opacity: 0, transformOrigin: "0% 50%" }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.4)" }, W(38.56));
tl.fromTo("#s08-row img", { rotation: -15 }, { rotation: 15, duration: 0.14, yoyo: true, repeat: 3, ease: "sine.inOut" }, W(39.2));
// zoom sur la ligne surlignée
tl.fromTo("#s08-zoom", { scale: 1, transformOrigin: "420px 1180px" }, { scale: 1.2, duration: 0.8, ease: "power3.inOut" }, W(40.04));
window.__timelines["s08"] = tl;
})();
</script>
</template>
</body>
</html>
