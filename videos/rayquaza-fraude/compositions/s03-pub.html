<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8" /></head>
<body>
<template id="s03-template">
<style>

@font-face{font-family:"Archivo Black";src:url(assets/fonts/ArchivoBlack.woff2) format("woff2")}
@font-face{font-family:"Press Start 2P";src:url(assets/fonts/PressStart2P.woff2) format("woff2")}
@font-face{font-family:"Space Mono";font-weight:400;src:url(assets/fonts/SpaceMono-Regular.woff2) format("woff2")}
@font-face{font-family:"Space Mono";font-weight:700;src:url(assets/fonts/SpaceMono-Bold.woff2) format("woff2")}

.px{position:absolute;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.abs{position:absolute}
.disp{position:absolute;font-family:"Archivo Black";text-transform:uppercase;line-height:.92;letter-spacing:-.03em;color:#F3F1E4}
.pix{position:absolute;font-family:"Press Start 2P";line-height:1.35;color:#F3F1E4}
.mono{font-family:"Space Mono"}
.stamp{position:absolute;font-family:"Archivo Black";text-transform:uppercase;color:#E23B3B;border:16px solid #E23B3B;border-radius:22px;padding:4px 34px;letter-spacing:.02em;line-height:1.05}
.ghost{position:absolute;font-family:"Archivo Black";color:#fff;opacity:.07;white-space:nowrap;line-height:.8;text-transform:uppercase}
.gstack{display:grid}
.gstack>*{grid-area:1/1}
.gb{position:relative;z-index:2}
.gc{z-index:1;opacity:0;mix-blend-mode:screen}
.gc.w{color:#ff3b6b}.gc.c{color:#3bd5ff}
.cam{position:absolute;inset:0}

#s03{position:absolute;inset:0;overflow:hidden;background:#1a1404}
</style>
<div id="s03" data-composition-id="s03" data-width="1080" data-height="1920">
<style>
#s03-rays{left:-760px;top:-80px;width:2600px;height:2600px;border-radius:50%;background:repeating-conic-gradient(from 0deg,#4a3808 0 6deg,#1a1404 6deg 12deg)}
#s03-glow{left:90px;top:520px;width:900px;height:720px;border-radius:50%;background:radial-gradient(#F4C43088,transparent 65%)}
#s03-earth{left:-220px;top:1480px;width:1520px;height:1520px;border-radius:50%;background:radial-gradient(circle at 40% 25%,#4fa0e8,#1d4f86 55%,#0b2340);box-shadow:0 0 80px #7fd0ff77}
#s03-ray{left:320px;top:610px;width:440px;filter:drop-shadow(0 0 34px #F4C430)}
#s03-badge{left:60px;top:420px;font-size:32px;background:#F4C430;color:#10140F;padding:14px 22px}
#s03-t1{left:60px;top:500px;width:960px;font-size:110px;color:#F4C430}
#s03-t2{left:60px;top:1075px;font-size:60px;text-shadow:0 6px 0 #000}
#s03-t3{left:60px;top:1148px;width:980px;font-size:56px;color:#F4C430;text-shadow:0 6px 0 #000}
.s03-star{position:absolute;color:#ffe9a0;font-size:60px;font-family:"Archivo Black"}
</style>
<div class="abs" id="s03-rays"></div>
<div class="abs" id="s03-glow"></div>
<div class="abs" id="s03-earth"></div>
<span data-layout-allow-overlap class="s03-star" style="left:150px;top:860px">✦</span>
<span data-layout-allow-overlap class="s03-star" style="left:860px;top:760px">✦</span>
<span data-layout-allow-overlap class="s03-star" style="left:820px;top:1040px">✦</span>
<span data-layout-allow-overlap class="s03-star" style="left:210px;top:1060px">✦</span>
<img class="px" id="s03-ray" src="assets/sprites/rayquaza.png" alt="Rayquaza">
<div class="pix" id="s03-badge">✓ OFFICIEL</div>
<div class="disp" id="s03-t1">Gardien ultime</div>
<div class="disp" id="s03-t2">Dieu serpent du ciel</div>
<div class="disp" id="s03-t3">Protecteur de l'humanité</div>
</div>
<script>
(() => {
const tl = gsap.timeline({ paused: true });
const S0 = 6.5;
const W = (t) => +(t + 0.2 - S0).toFixed(3);
const G = (g) => +(g - S0).toFixed(3);

const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const shake = (target, start, dur, amp, seed = 1) => {
  const n = Math.max(2, Math.round(dur / 0.04));
  for (let i = 0; i < n; i++) {
    const k = 1 - i / n;
    tl.to(target, { x: (hash(seed * 31 + i * 7) * 2 - 1) * amp * k, y: (hash(seed * 17 + i * 13) * 2 - 1) * amp * k, duration: dur / n, ease: "none" }, start + (i * dur) / n);
  }
  tl.to(target, { x: 0, y: 0, duration: 0.04, ease: "none" }, start + dur);
};
const glitch = (stackSel, start, dur, maxSplit) => {
  const copies = gsap.utils.toArray(stackSel + " .gc");
  const amp = { a: 0 };
  tl.set(amp, { a: 1 }, start);
  tl.set(copies, { opacity: 0.85 }, start);
  tl.to(amp, { a: 0, duration: dur, ease: "power3.in", onUpdate: () => {
    const step = Math.floor(tl.time() / 0.05);
    copies.forEach((el, l) => gsap.set(el, { x: (hash(step * 13 + l * 7) * 2 - 1) * maxSplit * amp.a, y: (hash(step * 29 + l * 11) * 2 - 1) * maxSplit * 0.35 * amp.a }));
  } }, start);
  tl.set(copies, { x: 0, y: 0, opacity: 0 }, start + dur);
};
const pop = (el, t, d = 0.45, from = 0) => tl.fromTo(el, { scale: from, opacity: 0 }, { scale: 1, opacity: 1, duration: d, ease: "back.out(2.2)" }, t);
const slam = (el, t, from = 2.6, rot = 0) => tl.fromTo(el, { scale: from, opacity: 0, rotation: rot }, { scale: 1, opacity: 1, rotation: rot, duration: 0.24, ease: "power4.in" }, t);
const breathe = (el, t, dur, amp = 14, period = 1.6) => tl.fromTo(el, { y: 0 }, { y: -amp, duration: period / 2, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor(dur / (period / 2)) - 1) }, t);

tl.fromTo("#s03-rays", { rotation: 0 }, { rotation: 40, duration: 7.7, ease: "none" }, 0);
tl.fromTo("#s03-earth", { y: 420 }, { y: 0, duration: 1.2, ease: "expo.out" }, 0);
tl.fromTo("#s03-glow", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 1, ease: "power2.out" }, 0);
tl.fromTo("#s03-glow", { scale: 1 }, { scale: 1.12, duration: 0.9, yoyo: true, repeat: 6, ease: "sine.inOut", immediateRender: false }, 1);
tl.fromTo("#s03-ray", { y: 260, opacity: 0, scale: 0.7 }, { y: 0, opacity: 1, scale: 1, duration: 0.9, ease: "expo.out" }, 0.1);
tl.fromTo("#s03-ray", { y: 0 }, { y: -22, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 7, immediateRender: false }, 1);
gsap.utils.toArray(".s03-star").forEach((el, i) => {
  tl.fromTo(el, { scale: 0, opacity: 0, rotation: 0 }, { scale: 1, opacity: 1, rotation: 90, duration: 0.5, ease: "back.out(3)", yoyo: true, repeat: 5 }, 0.6 + i * 0.35);
});
pop("#s03-badge", W(7.84), 0.4);
tl.fromTo("#s03-t1", { scale: 1.6, opacity: 0, filter: "blur(16px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power4.out" }, W(8.32));
tl.fromTo("#s03-t2", { x: -900, opacity: 0 }, { x: 0, opacity: 1, duration: 0.42, ease: "expo.out" }, W(10.4));
tl.fromTo("#s03-t3", { y: 120, rotation: -6, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "back.out(2)" }, W(12.0));
window.__timelines["s03"] = tl;
})();
</script>
</template>
</body>
</html>
