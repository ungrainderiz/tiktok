<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8" /></head>
<body>
<template id="s11-template">
<style>

@font-face{font-family:"Archivo Black";src:url(assets/fonts/ArchivoBlack.woff2) format("woff2")}
@font-face{font-family:"Press Start 2P";src:url(assets/fonts/PressStart2P.woff2) format("woff2")}
@font-face{font-family:"Space Mono";font-weight:400;src:url(assets/fonts/SpaceMono-Regular.woff2) format("woff2")}
@font-face{font-family:"Space Mono";font-weight:700;src:url(assets/fonts/SpaceMono-Bold.woff2) format("woff2")}

.px{position:absolute;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.abs{position:absolute}
.disp{position:absolute;font-family:"Archivo Black";text-transform:uppercase;line-height:.92;letter-spacing:-.03em;color:#F3F1E4}
.pix{position:absolute;font-family:"Press Start 2P";line-height:1.35;color:#F3F1E4}
.mono{font-family:"Space Mono"}
.stamp{position:absolute;font-family:"Archivo Black";text-transform:uppercase;color:#E23B3B;border:16px solid #E23B3B;border-radius:22px;padding:4px 34px;letter-spacing:.02em;line-height:1.05}
.ghost{position:absolute;font-family:"Archivo Black";color:#fff;opacity:.07;white-space:nowrap;line-height:.8;text-transform:uppercase}
.gstack{display:grid}
.gstack>*{grid-area:1/1}
.gb{position:relative;z-index:2}
.gc{z-index:1;opacity:0;mix-blend-mode:screen}
.gc.w{color:#ff3b6b}.gc.c{color:#3bd5ff}
.cam{position:absolute;inset:0}

#s11{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 30%,#1d4a35,#0b1f17 70%)}
</style>
<div id="s11" data-composition-id="s11" data-width="1080" data-height="1920">
<style>
#s11-head{left:60px;top:420px;font-size:30px;color:#9fc7b2;width:960px}
.s11-st{position:absolute;border-top:10px solid #b8a67c}
#s11-st1{left:340px;top:770px;width:400px;height:110px;background:#8a7a5a}
#s11-st2{left:250px;top:880px;width:580px;height:110px;background:#776849}
#s11-st3{left:160px;top:990px;width:760px;height:110px;background:#62553a}
#s11-autel{left:378px;top:808px;font-size:30px;color:#F7F3D9}
#s11-ray{left:390px;top:440px;width:300px}
.s11-fan{position:absolute;top:1120px;width:120px;image-rendering:pixelated}
#s11-ola1{left:720px;top:520px;font-size:70px;color:#F4C430}
#s11-ola2{left:720px;top:590px;font-size:70px;color:#F4C430}
#s11-beam{left:490px;top:0;width:100px;height:780px;background:linear-gradient(#fff0,#fffbe0cc);opacity:0;transform-origin:50% 100%}
</style>
<div class="pix" id="s11-head">CONDITIONS POUR QU'IL BOUGE :</div>
<div class="abs" id="s11-beam"></div>
<div class="s11-st" id="s11-st3"></div><div class="s11-st" id="s11-st2"></div><div class="s11-st" id="s11-st1"></div>
<div class="pix" id="s11-autel">AUTEL ✓</div>
<img class="px" id="s11-ray" src="assets/sprites/rayquaza.png" alt="Rayquaza">
<div class="disp" id="s11-ola1">+ une</div><div class="disp" id="s11-ola2">ola !</div>
<img class="s11-fan" src="assets/sprites/foule/zigzaton.png" style="left:30px" alt="">
<img class="s11-fan" src="assets/sprites/foule/marill.png" style="left:155px" alt="">
<img class="s11-fan" src="assets/sprites/foule/arcko.png" style="left:280px" alt="">
<img class="s11-fan" src="assets/sprites/foule/poussifeu.png" style="left:405px" alt="">
<img class="s11-fan" src="assets/sprites/foule/gobou.png" style="left:530px" alt="">
<img class="s11-fan" src="assets/sprites/foule/tarsal.png" style="left:655px" alt="">
<img class="s11-fan" src="assets/sprites/foule/chenipotte.png" style="left:780px" alt="">
<img class="s11-fan" src="assets/sprites/foule/medhyena.png" style="left:905px" alt="">
</div>
<script>
(() => {
const tl = gsap.timeline({ paused: true });
const S0 = 52.6;
const W = (t) => +(t + 0.2 - S0).toFixed(3);
const G = (g) => +(g - S0).toFixed(3);

const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const shake = (target, start, dur, amp, seed = 1) => {
  const n = Math.max(2, Math.round(dur / 0.04));
  for (let i = 0; i < n; i++) {
    const k = 1 - i / n;
    tl.to(target, { x: (hash(seed * 31 + i * 7) * 2 - 1) * amp * k, y: (hash(seed * 17 + i * 13) * 2 - 1) * amp * k, duration: dur / n, ease: "none" }, start + (i * dur) / n);
  }
  tl.to(target, { x: 0, y: 0, duration: 0.04, ease: "none" }, start + dur);
};
const glitch = (stackSel, start, dur, maxSplit) => {
  const copies = gsap.utils.toArray(stackSel + " .gc");
  const amp = { a: 0 };
  tl.set(amp, { a: 1 }, start);
  tl.set(copies, { opacity: 0.85 }, start);
  tl.to(amp, { a: 0, duration: dur, ease: "power3.in", onUpdate: () => {
    const step = Math.floor(tl.time() / 0.05);
    copies.forEach((el, l) => gsap.set(el, { x: (hash(step * 13 + l * 7) * 2 - 1) * maxSplit * amp.a, y: (hash(step * 29 + l * 11) * 2 - 1) * maxSplit * 0.35 * amp.a }));
  } }, start);
  tl.set(copies, { x: 0, y: 0, opacity: 0 }, start + dur);
};
const pop = (el, t, d = 0.45, from = 0) => tl.fromTo(el, { scale: from, opacity: 0 }, { scale: 1, opacity: 1, duration: d, ease: "back.out(2.2)" }, t);
const slam = (el, t, from = 2.6, rot = 0) => tl.fromTo(el, { scale: from, opacity: 0, rotation: rot }, { scale: 1, opacity: 1, rotation: rot, duration: 0.24, ease: "power4.in" }, t);
const breathe = (el, t, dur, amp = 14, period = 1.6) => tl.fromTo(el, { y: 0 }, { y: -amp, duration: period / 2, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor(dur / (period / 2)) - 1) }, t);

tl.fromTo("#s11-head", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: "steps(29)" }, W(52.48));
const fans = gsap.utils.toArray(".s11-fan");
// la foule « prie » en attendant
fans.forEach((f, i) => {
  tl.fromTo(f, { y: 0 }, { y: -14, duration: 0.3, yoyo: true, repeat: 9, ease: "sine.inOut" }, 0.1 + i * 0.04);
});
// on construit l'autel
["#s11-st3", "#s11-st2", "#s11-st1"].forEach((s, i) => {
  tl.fromTo(s, { y: 500, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, W(54.88) + i * 0.13);
});
pop("#s11-autel", W(55.6), 0.3);
// la ola
fans.forEach((f, i) => {
  tl.fromTo(f, { y: 0 }, { y: -150, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, W(56.2) + i * 0.07);
});
// il daigne descendre
tl.fromTo("#s11-beam", { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.25, ease: "power2.out" }, W(56.3));
tl.fromTo("#s11-ray", { y: -900 }, { y: 0, duration: 0.5, ease: "back.out(1.4)" }, W(56.4));
tl.to("#s11-beam", { opacity: 0, duration: 0.6 }, W(57.0));
pop("#s11-ola1", W(56.44), 0.3);
pop("#s11-ola2", W(56.6), 0.3);
window.__timelines["s11"] = tl;
})();
</script>
</template>
</body>
</html>
