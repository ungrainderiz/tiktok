<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0b1530; }
      #root { width: 100%; height: 100%; position: relative; }
    </style>
  </head>
  <body>
    <!-- Video 2 « Les 8 zones du gouffre » : no voice-over, the script is on screen (scripts/grab-a-bird-devlog.md) -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="38" data-width="1080" data-height="1920">
      <!-- one continuous fall through the real map, rendered in Blender (JEUX 2/blender/video_jour7/rendu_zones.py) -->
      <video id="chute" class="clip" src="assets/video/chute.mp4" data-start="0" data-duration="38"
        data-track-index="1" muted playsinline
        style="position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; z-index: 1"></video>
      <div id="titres" data-composition-id="titres" data-composition-src="compositions/titres.html"
        data-start="0" data-duration="38" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
