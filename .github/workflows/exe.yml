name: Construire le .exe Windows

on:
  push:
    paths:
      - "decoupeur.py"
      - ".github/workflows/exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Télécharger ffmpeg
        shell: bash
        run: |
          curl -sSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip
          unzip -q ffmpeg.zip -d ffmpeg
          cp ffmpeg/*/bin/ffmpeg.exe ffmpeg/*/bin/ffprobe.exe .

      - name: Compiler
        shell: bash
        run: |
          pip install pyinstaller
          pyinstaller --onefile --windowed --name DecoupeurVideo \
            --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." decoupeur.py

      - name: Tester le découpage
        shell: bash
        run: |
          ./ffmpeg.exe -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=30 \
            -f lavfi -i sine=f=440 -t 60 -c:v libopenh264 -b:v 10M -g 60 -c:a aac test.mp4 \
            || ./ffmpeg.exe -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=30 \
            -f lavfi -i sine=f=440 -t 60 -c:v mpeg4 -q:v 2 -g 60 -c:a aac test.mp4
          ls -l test.mp4
          rm ffmpeg.exe ffprobe.exe   # vérifie que le .exe utilise bien son ffmpeg intégré
          ./dist/DecoupeurVideo.exe test.mp4 --console --taille 10
          ls -l test_parties
          for f in test_parties/*; do [ $(stat -c %s "$f") -le 10000000 ] || { echo "trop gros: $f"; exit 1; }; done

      - uses: actions/upload-artifact@v4
        with:
          name: DecoupeurVideo-exe
          path: dist/DecoupeurVideo.exe

      - name: Publier (lien de téléchargement direct)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pc >/dev/null 2>&1 || \
            gh release create pc --target "${GITHUB_SHA}" --title "Découpeur vidéo (Windows)" \
              --notes "Télécharge DecoupeurVideo.exe, puis glisse ta vidéo dessus (ou double-clique pour choisir la vidéo). ffmpeg est inclus." --prerelease
          gh release upload pc dist/DecoupeurVideo.exe --clobber
